name: S2Dao Java 8 CI & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # กำหนด Mirror เฉพาะ Repo ของ Seasar เท่านั้น (ไม่ใช้ * แล้ว)
      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings>
            <mirrors>
              <mirror>
                <id>seasar-https-mirror</id>
                <mirrorOf>maven.seasar.org,seasar,seasar-repository</mirrorOf>
                <name>Seasar HTTPS Mirror</name>
                <url>https://maven.seasar.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build and Test S2Dao
        run: >
          mvn clean package -B -V -e
          -s ~/.m2/settings.xml
          -Dmaven.compiler.source=1.8
          -Dmaven.compiler.target=1.8

      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s2dao-jar-packages
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          retention-days: 7